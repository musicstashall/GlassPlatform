<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Макеты GlassSetup — production UI</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#242631;color:#eee;font:13px 'Segoe UI',sans-serif}main{width:1000px;margin:auto}iframe{width:1000px;height:540px;display:block;border:0}.progress{height:4px;background:#101225}.footer{height:56px;background:linear-gradient(#1a1b32,#111223);border-top:1px solid #ffffff16;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 28px}.footer button{padding:8px 25px;border:1px solid #ffffff30;border-radius:5px;background:#29283e;color:#eee}.footer button.primary{background:#c1b4ff;color:#201b35}p{color:#a1a6bf}
</style><main><p>Реальный HTML-ресурс мастеров; системные действия заменены тестовым host. Клиентская область 1000 × 600.</p><iframe id="runtime" title="Реальный UI продуктов"></iframe><div class="progress"></div><div class="footer"><button>Назад</button><button class="primary">Далее</button><button>Отмена</button></div><p id="messages"></p></main><script>
(async()=>{
const os64=new URLSearchParams(location.search).get('os')!=='x86',shellSuffix=' и оболочки Windows';
const unins=location.hash==='#uninstall',frame=document.getElementById('runtime');
const titles=['Platform x64','Platform x86','GlassSettings','OpenGlass','SecureUxTheme'],ids=['x64','x86','settings','openglass','secureUxTheme'];
const components=ids.map((id,i)=>({id,title:titles[i],description:['Оформление 64-битных приложений'+(os64?shellSuffix:'')+'.','Оформление 32-битных приложений'+(!os64?shellSuffix:'')+'.','Управление настройками и службами','Оформление окон Windows','Средство для использования неподписанных визуальных стилей. Установка в System32.'][i],hidden:!os64&&(i===0||i===3),checked:unins?false:i<4&&(os64||(i!==0&&i!==3)),state:unins?'Сохранить':'Установить',warning:''}));
if(unins)components.push({id:'cleanup',slim:true,title:'Удалить настройки',description:'Все локальные профили + глобальные HKLM/DWM, включая настройки оставленных продуктов.',checked:false});
function recompute(){const active=id=>{const item=components.find(x=>x.id===id);return !item.hidden&&(unins?!item.checked:item.checked);};components[0].warning=active('x64')?'':'Не будет оформления 64-битных приложений'+(os64?shellSuffix:'')+'.';components[1].warning=active('x86')?'':'Не будет оформления 32-битных приложений'+(!os64?shellSuffix:'')+'.';components[2].warning=active('settings')?'':'Настройками реестра и службами придётся управлять вручную.';components[3].warning=active('openglass')&&!active('settings')?'Без GlassSettings параметры OpenGlass потребуется редактировать вручную в реестре, а службами и задачами — управлять вручную.':'';components[4].warning=active('secureUxTheme')&&!active('settings')?'Без GlassSettings визуальные стили и перезагрузку нужно контролировать вручную.':'';}
const listeners=[];function state(){recompute();for(const fn of listeners)fn({data:{type:'state',page:unins?'uninstall-select':'components',locale:'ru',appMode:unins?'unins':'setup',components:JSON.parse(JSON.stringify(components))}});}
window.runtimeHost={addEventListener:(event,fn)=>{if(event==='message')listeners.push(fn);},postMessage:message=>{document.getElementById('messages').textContent=message;if(message==='ready'){state();return;}if(message==='components:select-all'){for(const x of components)if(x.id!=='cleanup'&&!x.hidden)x.checked=true;state();return;}if(message.startsWith('component:')){const parts=message.split(':'),item=components.find(x=>x.id===parts[1]);if(item)item.checked=parts[2]==='1';state();}}};
let html=await(await fetch('runtime/slideshow.html')).text();html=html.replaceAll('https://glassplatform.invalid',location.origin+'/runtime');
html=html.replace('<script>','<script>window.chrome=window.chrome||{};window.chrome.webview=parent.runtimeHost;<\/script><script>');frame.srcdoc=html;
})();
</script></html>
