<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Макеты GlassSetup</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#242631;color:#e6e4f2;font:13px/1.5 'Segoe UI',Arial,sans-serif}header{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ffffff12;background:#191b2b}strong{font-size:15px}small{color:#a1a6bf;margin-left:12px}nav{display:flex;gap:8px}button{font:inherit;cursor:pointer;padding:8px 18px;border:1px solid #736b8d;border-radius:6px;color:#d4d1e4;background:transparent}button[aria-pressed=true]{background:#c1b4ff;color:#201b35;border-color:#c1b4ff}button:focus-visible{outline:2px solid white;outline-offset:3px}.viewport{overflow:auto;width:100%;padding:0}iframe{display:block;border:0;width:100%;min-width:1040px;height:770px;background:#242631}p{color:#a1a6bf;font-size:12px;margin:0;padding:0 24px 18px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}small{display:block;margin-left:0}}
</style></head><body><header><div><strong>Макеты GlassSetup</strong><small>Интерактивные прототипы · системные действия не выполняются</small></div><nav aria-label="Выбор макета"><button type="button" data-page="installer-products-preview.html" aria-pressed="true">Установщик</button><button type="button" data-page="uninstaller-products-preview.html" aria-pressed="false">Удалятор</button><button type="button" data-page="runtime-products-preview.html" aria-pressed="false">UI проекта Setup</button><button type="button" data-page="runtime-products-preview.html#uninstall" aria-pressed="false">UI проекта Unins</button></nav></header><main class="viewport"><iframe id="preview" title="Макет установщика" src="installer-products-preview.html"></iframe></main><p>Клиентская область каждого мастера — 1000 × 600 при 100% DPI. Внутри списка работает прокрутка. Проверяйте флажки, предупреждения и итоговый план.</p><script>
const frame=document.getElementById('preview');
function select(button){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.src=button.dataset.page;frame.title=button.textContent==='Удалятор'?'Макет удалятора':'Макет установщика';history.replaceState(null,'',button.textContent==='Удалятор'?'#uninstall':'#install')}
document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>select(button));if(location.hash==='#uninstall')select(document.querySelectorAll('nav button')[1]);
</script></body></html>
